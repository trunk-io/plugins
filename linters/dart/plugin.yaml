version: 0.1
downloads:
  - name: dart
    # https://dart.dev/get-dart/archive
    downloads:
      - os:
          linux: linux
          macos: macos
          windows: windows
        cpu:
          x86_64: x64
          arm_64: arm64
        url: https://storage.googleapis.com/dart-archive/channels/stable/release/${version}/sdk/dartsdk-${os}-${cpu}-release.zip
        strip_components: 1
lint:
  files:
    - name: dart
      extensions: [dart]
  definitions:
    - name: dart
      files: [dart]
      download: dart
      known_good_version: 3.10.8
      version_command:
        parse_regex: "Dart SDK version: ${semver}"
        run: dart --version
      suggest_if: config_present
      description: Lints and formats dart code
      issue_url_format: https://dart.dev/tools/linter-rules/{}
      direct_configs:
        - analysis_options.yaml
      affects_cache:
        - pubspec.yaml
      environment:
        - name: PATH
          list: ["${env.PATH}", "${linter}/bin"]
      commands:
        - name: format
          output: rewrite
          # By default, trunk linters attempt to move to each file's directory to format it,
          # but this slows down Dart formatters and increases the occurrence of errors.
          run_from: ${root_or_parent_with(analysis_options.yaml)}
          run: dart format ${target}
          batch: true
          in_place: true
          formatter: true
          success_codes: [0]

        - name: fix
          # Some analyze results are autofixable, others are not.
          output: rewrite
          run_from: ${root_or_parent_with(analysis_options.yaml)}
          run: dart fix --apply ${target}
          batch: true
          fix_prompt: Quick fix available
          fix_verb: fix
          in_place: true
          success_codes: [0]
          enabled: false

        - name: analyze
          output: regex
          # The JSON format reports absolute paths, so a batch can be analyzed in a single pass from
          # the project root rather than once per parent directory. The default format is explicitly
          # documented as unstable between releases.
          run_from: ${root_or_parent_with(analysis_options.yaml)}
          parse_regex: '"code":"(?P<code>[^"]+)","severity":"(?P<severity>[A-Z]+)","type":"[A-Z_]+","location":\{"file":"(?P<path>[^"]+)","range":\{"start":\{"offset":\d+,"line":(?P<line>\d+),"column":(?P<col>\d+)\}.*?"problemMessage":"(?P<message>[^"]*)"'
          run: dart analyze --no-fatal-warnings --format=json ${target}
          success_codes: [0, 3]
          batch: true
